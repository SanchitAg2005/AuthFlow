version: '3.8'

services:
  database:
    image: mongo:6.0
    container_name: authflow-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - authflow-network
    restart: always

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: authflow-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/authflow
      - JWT_SECRET=docker_compose_super_secret_authflow_key
      - JWT_EXPIRES_IN=24h
      - NODE_ENV=production
    depends_on:
      - database
    networks:
      - authflow-network
    restart: always

volumes:
  mongodb_data:

networks:
  authflow-network:
    driver: bridge
